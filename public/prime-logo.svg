<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle sombre -->
  <rect x="40" y="40" width="432" height="432" rx="116" fill="url(#bg2)"/>
  <rect x="46" y="46" width="420" height="420" rx="110" fill="none" stroke="url(#t2)" stroke-opacity="0.5" stroke-width="4"/>

  <!-- anneau hexagonal néon (bouclier Titan) -->
  <path d="M256 104 L388 180 L388 332 L256 408 L124 332 L124 180 Z"
        fill="none" stroke="url(#t2)" stroke-width="10" stroke-linejoin="round" filter="url(#glow2)" opacity="0.9"/>

  <!-- T néon -->
  <g filter="url(#glow2)">
    <rect x="160" y="176" width="192" height="44" rx="14" fill="url(#t2)"/>
    <rect x="234" y="176" width="44" height="180" rx="14" fill="url(#t2)"/>
  </g>

  <!-- étoile sommet -->
  <path d="M256 92 l9 18 20 3 -14.5 14 3.5 20 -18 -9.5 -18 9.5 3.5 -20 -14.5 -14 20 -3 Z"
        fill="#22d3ee" filter="url(#glow2)"/>
</svg>
